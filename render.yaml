databases:
  - name: autostock-db
    plan: free
    region: virginia
    databaseName: autostock
    user: autostock

services:
  - type: web
    name: autostock-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: bash ./build.sh
    startCommand: bash ./start.sh
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autostock-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: "^https://.*\\.onrender\\.com$"

  - type: web
    name: autostock-web
    runtime: static
    rootDir: frontend
    buildCommand: 'export VITE_API_URL="${BACKEND_EXTERNAL_URL}/api" && npm ci && npm run build'
    staticPublishPath: ./dist
    envVars:
      - key: BACKEND_EXTERNAL_URL
        fromService:
          type: web
          name: autostock-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
